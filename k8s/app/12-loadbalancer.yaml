# LoadBalancer service configuration
# Exposes the frontend application to the internet via AWS Elastic Load Balancer

apiVersion: v1
kind: Service
metadata:
  name: frontend-external
  namespace: boutique
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP